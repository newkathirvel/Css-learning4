<!DOCTYPE html>
<html lang="en">

<section>

</div>

<div class="right-side">

<form action="">

<div class="input-field">
<i class="icon fa-solid fa-user"></i>

</div>

</div>

</div>

<div class="input-field">

</div>

</div>
</div>
